<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>一平 予約・席</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --fs:19px;            /* 1〜2mの視認性はここで調整。画面右上の A- / A+ が書き換える */
  --sumi:#1A1513; --sumi-lit:#241D1A; --ash:#3A322D;
  --enji:#8E2432; --enji-label:#D98A92; --ame:#C98A3C; --ao:#185094; --karashi:#E0A526;
  --moegi:#7FB069;
  --kinari:#EFE6D6; --kinari-muted:#C9BCAA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}   /* display:flex 指定が hidden 属性を上書きするのを防ぐ */
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font:var(--fs)/1.3 -apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  font-variant-numeric:tabular-nums;
  background:var(--sumi);color:var(--kinari);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;flex-direction:column;
}
button{font:inherit;color:inherit;background:var(--sumi-lit);border:1px solid var(--ash);
  border-radius:8px;padding:.35em .7em;cursor:pointer;
  transition:background-color .18s ease,border-color .18s ease,transform .18s ease}
button:active{background:var(--ash);transform:translateY(1px)}
button.on{background:var(--enji);border-color:var(--enji);color:var(--kinari)}
button:disabled{opacity:.4;cursor:default}
button:disabled:active{background:var(--sumi-lit);transform:none}
input,select,textarea{font:inherit;padding:.4em;border:1px solid var(--ash);border-radius:8px;background:var(--sumi);color:inherit;width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--karashi);outline-offset:2px}

header{display:flex;align-items:center;gap:.35em;padding:.3em .5em;border-bottom:1px solid var(--ash);background:var(--sumi-lit);flex:none}
header .grow{flex:1}
header h1{font-size:1em;margin:0 .4em 0 0;font-weight:700;letter-spacing:.22em}

#dates{display:flex;gap:4px;padding:.4em .6em;flex:none;align-items:center}
#dates button{flex:1;padding:.3em 0;text-align:center;line-height:1.15}
#dates button small{display:block;font-size:.72em;color:var(--kinari);opacity:.68}
#dates button.on small{color:var(--kinari);opacity:.85}
.sat{color:var(--karashi)}.sun{color:var(--enji-label)}

#body{flex:1;display:flex;gap:.5em;padding:0 .6em .6em;min-height:0}
#left{width:30%;min-width:280px;max-width:300px;display:flex;flex-direction:column;gap:.5em;min-height:0}
#body.left-off #left{display:none}
#grip{flex:none;width:2em;padding:0;writing-mode:vertical-rl;letter-spacing:.3em;
  background:var(--sumi-lit);border:1px solid var(--ash);color:var(--kinari);opacity:.85}
#right{flex:1;min-width:0;display:flex;flex-direction:column;gap:.5em;min-height:0}
.box{background:var(--sumi-lit);border:1px solid var(--ash);border-radius:10px;display:flex;flex-direction:column;min-height:0}
.box>h2{font-size:.85em;margin:0;padding:.45em .6em;border-bottom:1px solid var(--ash);
  display:flex;align-items:center;gap:.4em;color:var(--kinari);opacity:.8;font-weight:600;flex:none}
.box>h2 .grow{flex:1}
.box>h2 button{padding:.15em .5em;font-size:1em}
.list{overflow:auto;padding:.4em;display:flex;flex-direction:column;gap:.35em;-webkit-overflow-scrolling:touch}
.list.drop-tgt{outline:2px dashed var(--enji);outline-offset:-2px}

.item{border:1px solid var(--ash);border-left-width:6px;border-radius:8px;padding:.35em .5em;background:var(--sumi-lit);min-width:0;overflow-wrap:anywhere}
/* 通常の予約の線も赤〜黄の色相なので、線だけでは電話待ちと見分けられない。カードの地ごと洋がらしに寄せる */
.item.wait{border-left-color:var(--karashi)!important;border-color:var(--karashi);background:color-mix(in srgb,var(--karashi) 16%,var(--sumi-lit))}
.badge{display:inline-block;flex:none;white-space:nowrap;padding:.1em .4em;font-size:.72em;font-weight:700;line-height:1.2;border-radius:4px;background:var(--karashi);color:var(--sumi);vertical-align:baseline}
.badge.next{background:var(--moegi);color:var(--sumi)}
.item .l1{display:flex;align-items:baseline;gap:.4em;flex-wrap:wrap}
.item .l1 .nm{flex:none;white-space:nowrap}  /* 名前を縦に1字ずつ折らない。詰めるのは横の時間・人数の方 */
.drag-handle{flex:none;padding:0 .3em;border:0;background:transparent;color:var(--kinari);opacity:.7;cursor:grab;touch-action:none}
.drag-handle:active{background:transparent;cursor:grabbing}
.item .nm{font-weight:700;font-size:1.05em}
.item .mt{color:var(--kinari);opacity:.7;font-size:.82em}
.item .tbl{font-size:.82em;color:var(--kinari-muted);font-weight:600}
.item .note{font-size:.85em;color:var(--karashi);font-weight:600;opacity:1;white-space:pre-line}
.item .acts{display:flex;gap:.3em;margin-top:.3em;flex-wrap:wrap}
.item .acts button{padding:.1em .45em;font-size:.8em;min-height:44px}
.empty{color:var(--kinari);opacity:.65;font-size:.85em;padding:.5em;text-align:center}

#map{flex:1;display:flex;gap:6px;min-height:0}
.zashiki-column{width:7em;flex:none;display:flex;flex-direction:column;gap:6px;min-height:0}
.main-map{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;min-height:0}
.row{flex:1;display:flex;gap:6px;min-height:0}
.seat{flex:1;min-width:0;container-type:inline-size;border:2px solid var(--ash);border-radius:10px;background:var(--sumi-lit);
  padding:2px 3px;display:flex;flex-direction:column;overflow:hidden;text-align:left;
  transition:background .18s ease,border-color .18s ease,transform .18s ease}
/* 使用中は1〜2m離れても一目で分かるよう、マス全体を青で塗る（2026-09-26、枠だけでは見分けられなかった） */
.seat.used{background:var(--ao);border-color:#6FA8EC}
/* 席の種類ごとの色: 左の太帯と番号の色で見分ける。青は使用中専用なので使わない */
.seat[data-g="0"]{--g:#A98BD6}  /* 座敷 17〜20: 紫 */
.seat[data-g="1"]{--g:#E0A526}  /* 小上り 11〜16: 山吹 */
.seat[data-g="2"]{--g:#7FB069}  /* テーブル 8〜10: 萌黄 */
.seat[data-g="3"]{--g:#D98A92}  /* カウンター 1〜7: 薄紅 */
.seat[data-g]:not([data-g="-1"]){box-shadow:inset 8px 0 0 var(--g);padding-left:11px;background-image:linear-gradient(color-mix(in srgb,var(--g) 12%,transparent),color-mix(in srgb,var(--g) 12%,transparent))}
.seat[data-g]:not([data-g="-1"]) .no span{color:var(--g)}
.seat.used[data-g] .no span{color:var(--kinari)}
.seat.has-next{border-color:var(--moegi)}
.seat.has-res{background:#2D2420}
.seat.used .no em{font-style:normal;font-size:.6em;color:var(--kinari);font-weight:600}
.seat.used .chip{background:transparent}
.seat.used .chip-note{color:var(--kinari)}
.seat.drop-tgt{border-color:var(--enji);border-style:dashed}
.seat .no{font-size:1.15em;font-weight:700;line-height:1;display:flex;gap:.25em;align-items:center}
.seat .no em{font-style:normal;font-size:.6em;color:var(--ao);font-weight:600}
.seat .as{flex:1;display:flex;flex-direction:column;gap:2px;margin-top:2px;overflow:hidden}
.seat-empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--kinari);opacity:.35;font-size:.85em;letter-spacing:.05em}
.chip{border-left:5px solid;border-radius:4px;background:var(--sumi-lit);padding:2px 4px;font-size:1em;
  line-height:1.1;overflow:hidden;touch-action:none;
  flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;cursor:grab;
  transition:background-color .18s ease,border-color .18s ease,transform .18s ease}
.chip:active{cursor:grabbing}
.chip.arrived{border-left-color:var(--ao)!important}
.chip.next{background:var(--sumi-lit)!important;border-left-color:var(--moegi)!important}
.chip.solo .chip-name{font-size:clamp(1em,22cqw,1.75em);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}  /* 1件なら縦に余裕がある。最大2行 */
.chip.solo .chip-meta{flex-direction:row;gap:.5em;font-size:clamp(.85em,13cqw,1.2em);margin-top:.15em}
.chip.solo .chip-time{order:-1}
.chip.two-line .chip-name{font-size:clamp(.9em,16cqw,1.2em)}
@container (max-width:150px){
  .chip.solo .chip-meta{flex-direction:column;gap:0}
  .chip.solo .chip-time{order:0}
}
@container (max-width:120px){
  .chip .l1{flex-wrap:wrap;white-space:normal}
  .chip-name{white-space:normal;overflow-wrap:anywhere;text-overflow:clip}
}
.chip .l1{display:flex;align-items:center;gap:.15em;min-width:0;white-space:nowrap}
.chip-name{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;padding:.2em 0}
.chip-meta{display:flex;flex-direction:column;gap:1px;min-width:0;overflow:hidden}
.chip-people,.chip-time{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.chip-note{color:var(--karashi);font-weight:600;font-size:.8em;margin-top:.1em;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.chip.two-line .chip-note{display:none}
.chip.two-line{padding:1px 3px;font-size:1.05em}
.chip.two-line .chip-meta{flex-direction:row;gap:.35em}
.chip.two-line .chip-time{order:-1}
#map .main-map .row:nth-child(3) .chip{border-left-width:3px;padding:1px 0;font-size:.85em}
#map .main-map .row:nth-child(3) .l1{position:relative}
#map .main-map .row:nth-child(3) .chip-name{padding-left:.15em}
.drag-preview{position:fixed;z-index:10;pointer-events:none;max-width:12em;padding:.25em .45em;border:1px solid var(--enji);
  border-radius:6px;background:var(--sumi-lit);color:var(--kinari);font-size:.85em;box-shadow:0 2px 7px rgba(20,12,8,.55)}
.extra{display:flex;flex:1;min-width:0;gap:2px}
.extra .seat{min-width:0}
.extra-del{flex:none;width:1.65em;padding:0;border-radius:7px;color:var(--kinari);opacity:.7}
.hint{font-size:.8em;color:var(--kinari);opacity:.65;padding:0 .2em}
#bkpOpen.warn{border-color:var(--enji);background:var(--enji);color:var(--kinari);font-weight:700}
#bkpLastExport.warn{color:var(--enji-label);font-weight:700}
#undoBtn:not(:disabled){border-color:var(--karashi);color:var(--karashi);font-weight:700}
.not-today-bar{background:var(--enji);color:var(--kinari);font-size:.82em;font-weight:700;padding:.2em .6em;text-align:center;flex:none;letter-spacing:.05em}
.legend{display:flex;align-items:center;gap:.5em;font-size:.75em;color:var(--kinari);opacity:.85;min-width:0;overflow:hidden;flex:0 1 auto}
/* 幅が足りないときは凡例の方を削り、右端のボタンは見切れさせない（2026-09-29） */
#exNo,#exAdd,#bkpOpen{flex:none}
.lg-item{display:inline-flex;align-items:center;gap:.2em;white-space:nowrap}
.lg-swatch{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}
.lg-empty{background:var(--sumi-lit);border:1px solid var(--ash)}
.lg-res{background:#2D2420;border:1px solid var(--ash)}
.lg-used{background:var(--ao);border:1px solid #6FA8EC}
.lg-next{background:var(--moegi)}
.lg-wait{background:var(--karashi)}
.lg-guide{font-size:.9em;color:var(--kinari-muted);margin-left:.3em;white-space:nowrap}

dialog{border:1px solid var(--ash);border-radius:14px;padding:0;max-width:620px;width:92%;max-height:calc(100dvh - 16px);overflow:auto;background:var(--sumi-lit);color:var(--kinari);box-shadow:0 12px 40px rgba(20,12,8,.55)}
dialog::backdrop{background:#0006}
form.f{padding:.7em 1em;display:grid;grid-template-columns:5.5em 1fr;gap:.45em .7em;align-items:center}
form.f h3{grid-column:1/-1;margin:0 0 .2em}
form.f textarea{resize:vertical}
form.f .wide{grid-column:1/-1;display:flex;gap:.5em;justify-content:flex-end}
form.f .wide:last-of-type{position:sticky;bottom:0;background:var(--sumi-lit);padding:.4em 0;margin-bottom:-.7em;border-top:1px solid var(--ash);z-index:2}
form.f .wide button.on{order:9}
form.f .wide button.on{order:9}
form.f label{color:var(--kinari);opacity:.75;font-size:.9em}
form.f .message{grid-column:1/-1;margin:0;color:var(--enji-label);font-size:.85em}
.snapshot-head{grid-column:1/-1;display:flex;align-items:center;gap:.5em;margin-top:.35em}
.snapshot-head strong{flex:1}
.snapshot-list{grid-column:1/-1;display:flex;flex-direction:column;gap:.35em;max-height:40dvh;overflow:auto}
.snapshot-row{display:flex;align-items:center;gap:.5em;padding:.35em .45em;border:1px solid var(--ash);border-radius:8px;font-size:.85em}
.snapshot-row span{flex:1}
.form-note{grid-column:1/-1;margin:0;font-size:.8em;color:var(--kinari);opacity:.75;line-height:1.5}
.btn-grid{display:grid;gap:4px}
.btn-grid.cols-5{grid-template-columns:repeat(5,1fr)}
.btn-group{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.btn-group .p-btn{flex:1 1 0;min-width:2.4em;min-height:44px;font-size:1em}  /* 混雑時に指で押す。数字だけの小さなボタンにしない */
.btn-group .p-btn[data-val="more"]{flex:2 1 0}
.btn-group .p-btn[data-val=""]{min-width:3.2em;white-space:nowrap}
.btn-group button,.btn-grid button{padding:.25em .3em;font-size:.85em;min-height:36px;border-radius:6px;line-height:1.1}
.btn-group button.on,.btn-grid button.on{background:var(--enji);border-color:var(--enji);color:var(--kinari);font-weight:700}
#actBtns button{min-height:56px;font-size:1.1em;padding:.5em 1em;border-radius:10px}
#actBtns button.btn-cancel-act{margin-top:16px;border:1px dashed var(--enji-label);color:var(--enji-label);background:transparent}
#actBtns button.btn-cancel-act:active{background:rgba(217,138,146,.15)}
</style>
</head>
<body>

<header>
  <h1>一平</h1>
  <span class="grow"></span>
  <button id="wPrev">‹ 前週</button>
  <button id="wToday">今日</button>
  <button id="wNext">翌週 ›</button>
  <span style="width:.5em"></span>
  <button id="undoBtn" disabled>元に戻す</button>
  <button id="fsDown">文字 小</button>
  <button id="fsUp">文字 大</button>
</header>

<div id="dates"></div>
<div id="notTodayBar" class="not-today-bar" hidden></div>

<div id="body">
  <div id="left">
    <div class="box" style="flex:1">
      <h2>卓未定の予約 <span class="grow"></span><button id="addRes">＋ 予約</button></h2>
      <div class="list" id="resList"></div>
    </div>
    <div class="box" style="flex:none">
      <h2 id="cxHead" style="border:none">終了・取消 (0) <span class="grow"></span><button id="cxToggle">表示</button></h2>
      <div class="list" id="cxList" hidden></div>
    </div>
  </div>

  <button id="grip" type="button"></button>

  <div id="right">
    <div id="map"></div>
    <div style="display:flex;gap:.5em;align-items:center;flex:none;white-space:nowrap;overflow:hidden">
      <div id="legend" class="legend">
        <span class="lg-item"><span class="lg-swatch lg-empty"></span>空き</span>
        <span class="lg-item"><span class="lg-swatch lg-res"></span>予約</span>
        <span class="lg-item"><span class="lg-swatch lg-used"></span>使用中</span>
        <span class="lg-item"><span class="lg-swatch lg-next"></span>次に入る</span>
        <span class="lg-item"><span class="lg-swatch lg-wait"></span>電話待ち</span>
        <span class="lg-guide">卓を押す→予約 ／ 名前を押す→使用中・食事終了</span>
      </div>
      <span class="hint" id="hint" style="overflow:hidden;text-overflow:ellipsis;min-width:0"></span>
      <span style="flex:1"></span>
      <input id="exNo" placeholder="番号" style="width:4.5em" inputmode="numeric">
      <button id="exAdd">臨時席を追加</button>
      <button id="bkpOpen">バックアップ</button>
    </div>
  </div>
</div>

<dialog id="dlg"><form class="f" method="dialog" id="frm" autocomplete="off"></form></dialog>
<dialog id="actDlg"><form class="f" method="dialog" id="actFrm">
  <h3 id="actTitle"></h3>
  <div id="actState" style="grid-column:1/-1;font-size:.9em;color:var(--kinari-muted);margin:-.2em 0 .4em"></div>
  <div id="actBtns" style="display:flex;flex-direction:column;gap:.5em;width:100%;grid-column:1/-1"></div>
</form></dialog>
<dialog id="editDlg"><form class="f" method="dialog" id="editFrm" autocomplete="off"></form></dialog>
<dialog id="askDlg"><form class="f" method="dialog" id="askFrm">
  <h3 id="askMessage"></h3>
  <div class="wide"><button value="cancel" type="button" autofocus>やめる</button><button value="yes" type="button" class="on">終了</button></div>
</form></dialog>
<dialog id="backupDlg"><form class="f" method="dialog" id="bkpFrm">
  <h3>バックアップ</h3>
  <p class="wide" id="bkpLastExport" style="margin:0;font-size:.85em"></p>
  <label>書き出し</label><button type="button" id="bkpExport" style="width:100%">ファイルに保存</button>
  <label>読み戻し</label><input type="file" id="bkpFile" accept="application/json,.json">
  <div class="snapshot-head"><strong>アプリの中の控え</strong><button type="button" id="snapshotSave">今の状態を保存</button></div>
  <div class="snapshot-list" id="snapshotList"></div>
  <p class="form-note">端末が壊れたときは復元できません。月に一度は「ファイルに保存」も行ってください。</p>
  <div class="wide hint" id="bkpOrigin" style="font-size:.8em"></div>
  <div class="wide"><button value="close" type="submit">閉じる</button></div>
</form></dialog>

<script>
'use strict';
/* ---------- 定数・設定 ---------- */
const CLOSED_WEEKDAYS=[3]; // 水曜日は定休日
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}; // 週は月曜始まり

// 定休日判定純粋関数: 指定日が定休日なら翌日以降の開いている日を返す
function getOpenDate(dStr){
  let cur=dStr;
  while(CLOSED_WEEKDAYS.includes(parse(cur).getDay())) cur=addDays(cur,1);
  return cur;
}

/* ---------- 共通ユーティリティ・正規化 ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
function normalizeDigits(s){
  return (s||'').replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).trim();
}
function normalizeDb(d){
  if(!d || typeof d !== 'object' || Array.isArray(d)) d = {};
  const entries = [];
  if(Array.isArray(d.entries)){
    for(const rawE of d.entries){
      if(!rawE || typeof rawE !== 'object' || typeof rawE.date !== 'string') continue;
      const e = {...rawE};
      e.id = e.id ? String(e.id) : uid();
      e.date = String(e.date);
      e.kind = (e.kind === 'res' || e.kind === 'wait') ? e.kind : 'res';
      e.name = typeof e.name === 'string' ? e.name : '';
      e.tel = typeof e.tel === 'string' ? e.tel : '';
      e.time = typeof e.time === 'string' ? e.time : '';
      e.note = typeof e.note === 'string' ? e.note : '';
      e.people = (typeof e.people === 'number' && !isNaN(e.people)) ? e.people : null;
      e.tables = Array.isArray(e.tables) ? [...new Set(e.tables.map(String))] : [];
      e.arrived = Boolean(e.arrived);
      e.gone = Boolean(e.gone);
      e.called = Boolean(e.called);
      e.cancelled = Boolean(e.cancelled);
      entries.push(e);
    }
  }
  const extra = Array.isArray(d.extra) ? d.extra.filter(x => x && typeof x.date === 'string' && x.no).map(x => ({...x, date: String(x.date), no: String(x.no)})) : [];
  let occ = {};
  if(d.occ && typeof d.occ === 'object' && !Array.isArray(d.occ)){
    for(const k in d.occ){
      occ[k] = Array.isArray(d.occ[k]) ? [...new Set(d.occ[k].map(String))] : [];
    }
  }
  const fs = (typeof d.fs === 'number' && !isNaN(d.fs)) ? Math.max(16, Math.min(24, d.fs)) : 19;
  return {...d, entries, extra, occ, fs};
}

/* ---------- 保存 ---------- */
const KEY='ippei.v1';
let loadFailed=false;
const load=()=>{
  const raw=localStorage.getItem(KEY);
  if(raw===null) return null;
  try{
    const parsed=JSON.parse(raw);
    if(parsed && typeof parsed==='object' && !Array.isArray(parsed)){
      return normalizeDb(parsed);
    }
    throw new Error('形式が違います');
  }catch(e){
    loadFailed=true;
    try{localStorage.setItem(KEY+'.broken.'+new Date().toISOString().replace(/[:.]/g,'-'),raw)}catch(_e){}
    return null;
  }
};
let db = load() || {entries:[], extra:[], occ:{}, fs:19};
db.fs=Math.max(16,Math.min(24,Number(db.fs)||19));
let undoStack=[], lastSaved=JSON.stringify(db);
const syncUndoBtn=()=>{const b=document.getElementById('undoBtn');if(b)b.disabled=!undoStack.length};
const save=()=>{
  const prevSaved=lastSaved;
  try{
    const cur=JSON.stringify(db);
    localStorage.setItem(KEY,cur);
    undoStack.push(prevSaved);
    if(undoStack.length>5)undoStack.shift();
    lastSaved=cur;
    syncUndoBtn();
  }catch(e){
    try{db=JSON.parse(prevSaved)}catch(_err){}
    draw();
    const quota=e.name==='QuotaExceededError'||/quota|exceeded/i.test(e.message||'');
    alert(quota
      ? '保存容量がいっぱいです。今の変更はまだ保存されていません。バックアップからファイルに保存してください。'
      : '保存できませんでした。\n'+e.message+'\n\n※ 今の変更はまだ保存されていません。');
  }
};
function undo(){
  if(!undoStack.length) return;
  const prev=undoStack[undoStack.length-1];
  try{
    localStorage.setItem(KEY,prev);
    undoStack.pop();
    lastSaved=prev;
    db=JSON.parse(prev);
    syncUndoBtn();
    document.querySelectorAll('dialog[open]').forEach(d=>d.close());
    draw();
    const h=document.getElementById('hint');
    if(h){h.textContent='1つ前に戻しました';setTimeout(()=>{if(h.textContent==='1つ前に戻しました')h.textContent=''},1500)}
  }catch(e){
    const quota=e.name==='QuotaExceededError'||/quota|exceeded/i.test(e.message||'');
    alert(quota
      ? '保存容量がいっぱいです。今の変更はまだ保存されていません。バックアップからファイルに保存してください。'
      : '保存できませんでした。\n'+e.message+'\n\n※ 今の変更はまだ保存されていません。');
  }
}

addEventListener('storage',ev=>{
  if(ev.key!==KEY||!ev.newValue||ev.newValue===lastSaved) return;
  document.querySelectorAll('dialog[open]').forEach(d=>d.close());
  db=JSON.parse(ev.newValue);lastSaved=ev.newValue;undoStack=[];syncUndoBtn();draw();
  const h=document.getElementById('hint');
  if(h){h.textContent='別の画面で変更されたため、最新の内容に更新しました';setTimeout(()=>{if(h)h.textContent=''},3000)}
});

/* ---------- バックアップ ---------- */
function exportText(data=db){return JSON.stringify({v:1,exportedAt:new Date().toISOString(),data})}
function downloadText(text,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  a.download=name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function saveTextToFiles(text,name){
  const file=new File([text],name,{type:'application/json'});
  if(navigator.canShare?.({files:[file]})){
    return navigator.share({files:[file]}).then(()=>true).catch(err=>{
      if(err?.name==='AbortError') return false;
      downloadText(text,name);return true;
    });
  }
  downloadText(text,name);
  return Promise.resolve(true);
}
function importText(text){
  let obj;
  try{obj=JSON.parse(text)}catch(_e){return false}
  if(!obj||obj.v!==1||!obj.data||typeof obj.data!=='object'||Array.isArray(obj.data)) return false;
  if('entries' in obj.data && !Array.isArray(obj.data.entries)) return false;
  db=normalizeDb(obj.data);
  return true;
}

/* ---------- アプリ内の控え ---------- */
const EXPORT_REMIND_DAYS=14;
function exportStaleDays(at=db.lastExport){
  if(!at) return Infinity;
  const d=Math.floor((parse(today())-parse(at))/86400000);
  return d<0?0:d;
}
const SNAPSHOT_DB='ippei', SNAPSHOT_STORE='snapshots', SNAPSHOT_MAX=14;
function pruneSnapshots(list,max){
  const sorted=[...list].sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  const cut=Math.max(0,sorted.length-max);
  return {keep:sorted.slice(cut),remove:sorted.slice(0,cut)};
}
function snapshotsDb(){return new Promise((resolve,reject)=>{
  const r=indexedDB.open(SNAPSHOT_DB,1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(SNAPSHOT_STORE))r.result.createObjectStore(SNAPSHOT_STORE,{keyPath:'id'})};
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
})}
function listSnapshots(){return snapshotsDb().then(d=>new Promise((resolve,reject)=>{
  const r=d.transaction(SNAPSHOT_STORE).objectStore(SNAPSHOT_STORE).getAll();
  r.onsuccess=()=>{d.close();resolve(r.result)};r.onerror=()=>{d.close();reject(r.error)};
}))}
function writeSnapshot(snapshot,remove){return snapshotsDb().then(d=>new Promise((resolve,reject)=>{
  const tx=d.transaction(SNAPSHOT_STORE,'readwrite'),store=tx.objectStore(SNAPSHOT_STORE);
  store.put(snapshot);remove.forEach(s=>store.delete(s.id));
  tx.oncomplete=()=>{d.close();resolve()};tx.onerror=()=>{d.close();reject(tx.error)};
}))}
const formatSnapshotAt=at=>{const d=new Date(at);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function hasAutoSnapshotOn(list,day){return list.some(s=>s.kind==='auto'&&ymd(new Date(s.at))===day)}
async function renderSnapshots(){
  const list=$('snapshotList');list.replaceChildren();
  try{
    const snapshots=(await listSnapshots()).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
    if(!snapshots.length){list.textContent='まだ控えはありません';return}
    snapshots.forEach(snapshot=>{
      const row=document.createElement('div'),info=document.createElement('span'),restore=document.createElement('button');
      row.className='snapshot-row';info.textContent=`${formatSnapshotAt(snapshot.at)}  予約 ${snapshot.count}件  ${snapshot.kind==='auto'?'自動':'手動'}`;
      restore.type='button';restore.textContent='戻す';restore.onclick=()=>restoreSnapshot(snapshot);
      row.append(info,restore);list.appendChild(row);
    });
  }catch(_e){list.textContent='控えを表示できませんでした'}
}
async function saveSnapshot(kind='manual',currentList,snap){
  const at=new Date().toISOString();
  const snapshot={id:at,at,kind,count:snap?snap.count:db.entries.length,text:snap?snap.text:exportText()};
  try{
    const list=currentList||await listSnapshots(),pruned=pruneSnapshots([...list,snapshot],SNAPSHOT_MAX);
    await writeSnapshot(snapshot,pruned.remove);await renderSnapshots();
    return true;
  }catch(err){
    $('snapshotList').textContent='控えを保存できませんでした';
    throw err;
  }
}
async function createDailySnapshot(){
  try{const list=await listSnapshots();if(!hasAutoSnapshotOn(list,today()))await saveSnapshot('auto',list)}catch(_e){}
}
function restoreSnapshot(snapshot){
  confirmThen(`${formatSnapshotAt(snapshot.at)} の控えに戻します。今の状態は控えに残します。`,async ()=>{
    try{
      await saveSnapshot('manual');
      if(importText(snapshot.text)){save();draw();bkpDlg.close()}
      else $('snapshotList').textContent='この控えは読み戻せませんでした';
    }catch(_e){
      alert('現在の状態を控えに保存できなかったため、復元を中止しました。');
    }
  },'戻す');
}

const ROWS=[
  {lab:'座敷',  nos:['17','18','19','20']},
  {lab:'小上り',nos:['11','12','13','14','15','16']},
  {lab:'テーブル',nos:['8','9','10']},
  {lab:'カウンター',nos:['1','2','3','4','5','6','7']},
];
const extraOf=d=>db.extra.filter(x=>x.date===d).map(x=>x.no);
const occOf=d=>(db.occ[d]||(db.occ[d]=[]));
const addExtra=(d,no)=>{
  const all=ROWS.flatMap(r=>r.nos).concat(extraOf(d));
  if(all.includes(no)) return false;
  db.extra.push({date:d,no});
  return true;
};

function drawDates(){
  const el=document.getElementById('dates');el.innerHTML='';
  for(let i=0;i<7;i++){
    const s=addDays(weekStart,i), d=parse(s), w=d.getDay();
    if(CLOSED_WEEKDAYS.includes(w)) continue; // 水曜日（定休日）は出さない
    const b=document.createElement('button');
    b.className=(s===date?'on ':'')+(w===0?'sun':w===6?'sat':'');
    b.dataset.date=s;

    b.onclick=()=>{date=s;weekStart=mondayOf(s);draw()};

  }
}

function itemEl(e){
  const isWait=e.kind==='wait';
  const div=document.createElement('div');
  div.className='item'+(isWait?' wait':'');
  div.dataset.entryId=e.id;
  div.style.borderLeftColor=isWait?'var(--karashi)':color(e.id);
  const meta=[e.time||'時間未定', e.people?e.people+'名':'人数未定', e.tel].filter(Boolean).join(' / ');
  div.innerHTML=`<div class="l1"><span class="nm"></span><span class="mt"></span></div>
    <div class="tbl"></div><div class="note mt"></div><div class="acts"></div>`;
  const nmEl=div.querySelector('.nm');
  nmEl.textContent=e.name;
  if(isWait){
    const badge=document.createElement('span');
    badge.className='badge';
    badge.textContent=e.called?'連絡済':'電話待ち';
    nmEl.after(badge);
  }
  const handle=document.createElement('button');handle.type='button';handle.className='drag-handle';handle.textContent='⠿';
  handle.setAttribute('aria-label',`${e.name} を卓へドラッグ`);handle.dataset.entryId=e.id;
  bindDrag(div,{type:'add',entryId:e.id},e.name);bindDrag(handle,{type:'add',entryId:e.id},e.name);div.querySelector('.l1').prepend(handle);
  div.querySelector('.mt').textContent=meta;
  div.querySelector('.tbl').textContent='卓未定';
  div.querySelector('.note').textContent=e.note||'';
  const acts=div.querySelector('.acts');
  const add=(t,fn)=>{const b=document.createElement('button');b.textContent=t;b.onclick=ev=>{ev.stopPropagation();fn()};acts.appendChild(b)};
  if(isWait&&!e.called) add('連絡済',()=>{e.called=true;save();draw()});
  if(isWait&&e.called)  add('連絡済 ✓',()=>{e.called=false;save();draw()});
  if(isWait){
    add('待ち解除',()=>{e.kind='res';save();draw()});
  }else{
    add('電話待ちにする',()=>{
      if(e.tel&&e.tel.trim()){
        e.kind='wait';e.called=false;save();draw();
      }else{
        openForm('wait',e);
      }
    });
  }
  add('取消',()=>cancelEntry(e));
  div.onclick=()=>openForm(e.kind,e);
  return div;
}

function drawLists(){
  const box=document.getElementById('resList');box.innerHTML='';
  const arr=listEntries(date);
  if(!arr.length){box.innerHTML='<div class="empty">卓未定なし</div>';}
  else{
    arr.sort((a,b)=>(a.time||'zz').localeCompare(b.time||'zz'));
    arr.forEach(e=>box.appendChild(itemEl(e)));
  }
  const vanished=db.entries.filter(e=>e.date===date&&(e.cancelled||e.gone)).slice().reverse();
  document.getElementById('cxHead').firstChild.textContent=`終了・取消 (${vanished.length}) `;
  const cxBtn=document.getElementById('cxToggle');
  const cl=document.getElementById('cxList');
  if(!vanished.length){
    if(cxBtn){
      cxBtn.disabled=true;
      cxBtn.textContent='表示';
    }
    cl.hidden=true;
    cl.innerHTML='<div class="empty">なし</div>';
  } else {
    if(cxBtn) cxBtn.disabled=false;
    cl.innerHTML='';
    vanished.forEach(e=>{
      const d=document.createElement('div');
      d.className='item';
      d.style.borderLeftColor='#aaa';
      const st=e.cancelled?'取消':'終了';
      const meta=[e.time||'時間未定', e.people?e.people+'名':'人数未定', st].filter(Boolean).join(' / ');
      const tblStr=e.tables&&e.tables.length?'卓 '+e.tables.join(', '):'卓未定';
      d.innerHTML=`<div class="l1"><span class="nm"></span><span class="mt"></span></div>
        <div class="tbl"></div><div class="acts"></div>`;
      d.querySelector('.nm').textContent=e.name;
      d.querySelector('.mt').textContent=meta;
      d.querySelector('.tbl').textContent=tblStr;
      const b=document.createElement('button');
      b.type='button';
      b.textContent=e.gone ? '使用中に戻す' : '予約に戻す';
      b.onclick=()=>{
        const allNos=ROWS.flatMap(r=>r.nos).concat(extraOf(e.date));
        const missing=e.tables.filter(no=>!allNos.includes(no));
        e.tables=e.tables.filter(no=>allNos.includes(no));

        if(e.cancelled) e.cancelled=false;
        if(e.gone){
          e.gone=false;
          if(e.tables.length>0){
            e.arrived=true;
            if(e.date===today()){
              e.tables.forEach(no=>setOcc(no,true));
            }
          } else {
            e.arrived=false;
          }
        }
        if(missing.length>0 && e.tables.length===0){
          e.arrived=false;
          const h=document.getElementById('hint');
          if(h){
            const mText=`卓${missing.join(',')}が無いので卓未定に戻しました`;
            h.textContent=mText;
            setTimeout(()=>{if(h.textContent===mText)h.textContent=''},3000);
          }
        }
        save();
        draw();
      };
      d.querySelector('.acts').appendChild(b);
      cl.appendChild(d);
    });
  }
}

function seatEl(no){
  const b=document.createElement('button');
  b.dataset.no=no;
  b.dataset.g=ROWS.findIndex(r=>r.nos.includes(no)); // 席の種類ごとの色分け（臨時席は-1で色なし）
  const isToday=date===today();
  const here=db.entries.filter(e=>e.date===date&&!e.cancelled&&!e.gone&&e.tables.includes(no));
  // 青は「来店済みの予約がこの卓にあるか」で決める。
  const used=here.some(e=>e.arrived);
  const hasArrived=isToday&&used;
  const hasNext=hasArrived&&here.some(e=>!e.arrived);
  const hasRes=!used&&here.length>0;
  b.className='seat'+(used&&isToday?' used':'')+(hasNext?' has-next':'')+(hasRes?' has-res':'');
  const nextBadge=hasNext?'<span class="badge next">次</span>':'';
  b.innerHTML=`<div class="no"><span></span>${used&&isToday?'<em>使用中</em>':''}${nextBadge}</div><div class="as"></div>`;
  b.querySelector('.no span').textContent=no;
  const as=b.querySelector('.as');
  if(here.length===0){
    const emptyEl=document.createElement('div');
    emptyEl.className='seat-empty';
    emptyEl.textContent='＋ 予約';
    as.appendChild(emptyEl);
  } else {
    // チップの並び: 来店済みを上、「次」を下にする（here を arrived 優先で並べてから slice(0,2)）
    here.sort((a,b)=>(b.arrived?1:0) - (a.arrived?1:0));
    here.slice(0,2).forEach(e=>{
      const isNext=hasArrived&&!e.arrived;
      const isWait=e.kind==='wait';
      const c=document.createElement('div');
      c.className='chip'+(here.length>1?' two-line':' solo')+(e.arrived?' arrived':'')+(isNext?' next':'');
      c.style.borderLeftColor=isNext?'var(--moegi)':(e.arrived?'var(--ao)':(isWait?'var(--karashi)':color(e.id)));
      c.innerHTML='<div class="l1"><b class="chip-name"></b></div><div class="chip-meta"><span class="chip-people"></span></div>';
      if(isNext){
        const nb=document.createElement('span');
        nb.className='badge next';
        nb.textContent='次';
        c.querySelector('.chip-name').before(nb);
      } else if(isWait && !e.arrived){
        const wb=document.createElement('span');
        wb.className='badge';
        wb.textContent=e.called?'連絡済':'電話待ち';
        c.querySelector('.chip-name').before(wb);
      }
      c.querySelector('.chip-name').textContent=e.name;
      c.querySelector('.chip-people').textContent=e.people?e.people+'名':'人数未定';
      if(e.time){const time=document.createElement('span');time.className='chip-time';time.textContent=e.time;c.querySelector('.chip-meta').appendChild(time)}
      const note1=(e.note||'').split('\n')[0].trim();
      if(note1){const n=document.createElement('div');n.className='chip-note';n.textContent=note1;c.appendChild(n)}
      c.dataset.entryId=e.id;c.dataset.from=no;
      c.setAttribute('aria-label',`${e.name} を卓または保留へドラッグ`);
      bindDrag(c,{type:'move',entryId:e.id,from:no},e.name);
      // チップのどこをタップしても状態ボタン画面を開く
      c.onclick=ev=>{ev.stopPropagation();openActDlg(e,no)};
      as.appendChild(c);
    });
    if(here.length>2){
      const more=document.createElement('div');more.className='chip';more.textContent=`他 ${here.length-2}件`;
      more.style.cursor='pointer';
      more.onclick=ev=>{
        ev.stopPropagation();
        openMoreDlg(here,no);
      };
      as.appendChild(more);
    }
  }
  // 卓マスのチップ以外をタップ：予約入力が開く（空席タップで使用中の切り替えはしない）
  b.onclick=()=>openForm('res',null,date,no);
  return b;
}

  return row ? row.lab : (extraOf(d).includes(no)?'追加':null);
}
function validTables(tables, d = date){
  const a=[...new Set(tables.map(String))].sort((x,y)=>Number(x)-Number(y));
  if(!a.length) return true;
  const group=seatGroup(a[0], d);
  return !!group && a.every(no=>seatGroup(no, d)===group);
}
function assignTables(e,tables, d = (e?.date || date)){
  const a=[...new Set(tables.map(String))].sort((x,y)=>Number(x)-Number(y));
  if(!validTables(a, d)) return false;
  const before=e.tables.slice();e.tables=a;
  if(e.arrived&&d===today()){
    before.filter(no=>!a.includes(no)).forEach(no=>setOcc(no,false));
    a.forEach(no=>setOcc(no,true));
  }
  return true;
}
function unassign(e){
  const before=e.tables.slice();e.tables=[];e.arrived=false;e.gone=false;
  if(date===today()||(e?.date&&e.date===today())) before.forEach(no=>setOcc(no,false));
  return true;
}
function moveTable(e,from,to){
  if(from===to || e.tables.includes(to)) return false;
  const i=e.tables.indexOf(from);if(i<0) return false;
  const tables=e.tables.slice();tables[i]=to;
  if(!validTables(tables, e.date)) return false;
  e.tables=tables.sort((a,b)=>Number(a)-Number(b));
  if(e.arrived&&e.date===today()){setOcc(from,false);setOcc(to,true)}
  return true;
}
function setOcc(no,on){
  const o=occOf(date), i=o.indexOf(no);
  if(on){ if(i<0) o.push(no) }
  else{
    if(i>=0) o.splice(i,1);
  }
}
function arrive(e){
  if(!e.tables.length) return false;
  e.arrived=true;
  if(date===today()) e.tables.forEach(no=>setOcc(no,true));
  save();draw();return true;
}
function leave(e){
  e.arrived=false;e.gone=true;
  e.tables.forEach(no=>setOcc(no,false));
  save();draw();
}
// 取消はどこから押しても ここを通す。来店済みを取消したら使用中も外す（2026-09-26、青いまま戻らなかった）
function cancelEntry(e){
  e.cancelled=true;
  if(e.arrived){e.arrived=false;e.tables.forEach(no=>setOcc(no,false))}  // cancelledを先に立てて、追加席の自動削除が効くようにする
  save();draw();
}
function delExtra(no){
  const hasRes=db.entries.some(e=>e.date===date&&!e.cancelled&&!e.gone&&e.tables.includes(no));
  if(hasRes){
    const h=document.getElementById('hint');
    if(h){
      h.textContent='予約が入っている臨時席は消せません。先に予約を別の卓へ移してください';
      setTimeout(()=>{if(h.textContent.includes('予約が入っている臨時席'))h.textContent=''},3000);
    }
    return;
  }
  db.extra=db.extra.filter(x=>!(x.date===date&&x.no===no));
  setOcc(no,false);save();draw();
}

/* ---------- ドラッグ＆ドロップ ---------- */
let drag=null,pendingDrag=null;
function notifyMoved(name,toNo){
  const h=document.getElementById('hint');
  if(h){
    h.textContent=`${name}を卓${toNo}へ移しました`;
    setTimeout(()=>{if(h.textContent.includes('へ移しました'))h.textContent=''},2000);
  }
}
function bindDrag(el,data,label){el.addEventListener('pointerdown',ev=>{
  if(drag||pendingDrag||ev.button!==0) return;
  pendingDrag={...data,pointerId:ev.pointerId,source:el,label,x:ev.clientX,y:ev.clientY};
})}
function startDrag(ev,state){
  if(drag) return;
  ev.preventDefault();ev.stopPropagation();
  state.source.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation()},{capture:true,once:true});
  const preview=document.createElement('div');preview.className='drag-preview';preview.textContent=state.label;document.body.appendChild(preview);
  drag={...state,preview};
  drag.source.classList.add('dragging');try{drag.source.setPointerCapture?.(ev.pointerId)}catch(_e){}moveDrag(ev);
}
function dragSeat(ev){
  const at=document.elementFromPoint(ev.clientX,ev.clientY);
  return at&&at.closest('.seat');
}
function dragList(ev){
  const at=document.elementFromPoint(ev.clientX,ev.clientY);
  return at&&at.closest('#resList');
}
function moveDrag(ev){
  if(!drag&&pendingDrag&&ev.pointerId===pendingDrag.pointerId){
    if(Math.hypot(ev.clientX-pendingDrag.x,ev.clientY-pendingDrag.y)<12) return;
    const state=pendingDrag;pendingDrag=null;startDrag(ev,state);
  }
  if(!drag||ev.pointerId!==drag.pointerId) return;
  drag.preview.style.left=ev.clientX+'px';drag.preview.style.top=ev.clientY+'px';
  document.querySelectorAll('.seat.drop-tgt,.list.drop-tgt').forEach(el=>el.classList.remove('drop-tgt'));
  const seat=dragSeat(ev), list=dragList(ev);
  if(seat) seat.classList.add('drop-tgt');
  else if(drag.type==='move'&&list) list.classList.add('drop-tgt');
}
function clearDrag(){
  pendingDrag=null;
  if(!drag) return;
  drag.preview.remove();drag.source.classList.remove('dragging');
  document.querySelectorAll('.seat.drop-tgt,.list.drop-tgt').forEach(el=>el.classList.remove('drop-tgt'));drag=null;
}
function endDrag(ev){
  if(!drag&&pendingDrag&&ev.pointerId===pendingDrag.pointerId){pendingDrag=null;return}
  if(!drag||ev.pointerId!==drag.pointerId) return;
  const state=drag, seat=dragSeat(ev), list=dragList(ev), no=seat&&seat.dataset.no, e=byId(state.entryId);
  let changed=e&&(no?(state.type==='add'?assignTables(e,[no]):moveTable(e,state.from,no)):state.type==='move'&&list&&unassign(e));
  clearDrag();
  if(changed){
    save();draw();
    if(no&&e) notifyMoved(e.name,no);
  }
}
document.addEventListener('pointermove',moveDrag);
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',clearDrag);
function dragFromTo(source,target){
  const a=source.getBoundingClientRect(),b=target.getBoundingClientRect(),id=99;
  const fire=(el,type,r)=>el.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,buttons:1,clientX:r.left+r.width/2,clientY:r.top+r.height/2}));
  fire(source,'pointerdown',a);fire(source,'pointermove',b);fire(source,'pointerup',b);
}

/* ---------- 入力フォーム ---------- */
const TIMES=(()=>{const a=[];for(let h=17;h<=21;h++)for(const m of['00','30'])a.push(h+':'+m);return a})();
const PEOPLE_MAX=50;

function createPeoplePicker(initialVal, syncInput){
  const wrap=document.createElement('div');
  wrap.className='btn-group';
  let curVal = (initialVal!==undefined && initialVal!==null && initialVal!=='') ? Number(initialVal) : null;
  const isMore = curVal !== null && curVal >= 9;

  const mkBtn=(text, val, on)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='p-btn'+(on?' on':'');
    b.textContent=text; b.dataset.val=val;
    return b;
  };

  const moreInput=document.createElement('input');
  moreInput.type='number'; moreInput.min='9'; moreInput.max='99';
  moreInput.name='peopleMore';
  moreInput.autocomplete='off';
  moreInput.style.cssText='width:4.5em;display:'+(isMore?'inline-block':'none');
  moreInput.placeholder='人数';
  if(isMore) moreInput.value=curVal;

  const btns=[];
  btns.push(mkBtn('未定', '', curVal===null));
  for(let n=1; n<=8; n++){
    btns.push(mkBtn(String(n), String(n), curVal===n));
  }
  const moreBtn=mkBtn('9名以上', 'more', isMore);
  btns.push(moreBtn);

  const updateSync=()=>{
    if(!syncInput) return;
    const v=picker.getValue();
    syncInput.value = v===null ? '' : String(v);
  };

  btns.forEach(b=>{
    b.onclick=()=>{
      btns.forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      if(b.dataset.val==='more'){
        moreInput.style.display='inline-block';
        moreInput.focus();
      } else {
        moreInput.style.display='none';
      }
      updateSync();
    };
    wrap.appendChild(b);
  });
  moreInput.oninput=updateSync;
  wrap.appendChild(moreInput);

  const picker = {
    el: wrap,
    getValue: ()=>{
      const active=btns.find(b=>b.classList.contains('on'));
      if(!active || !active.dataset.val) return null;
      if(active.dataset.val==='more'){
        const v=parseInt(moreInput.value,10);
        return isNaN(v)?null:v;
      }
      return parseInt(active.dataset.val,10);
    },
    setValue: (val)=>{
      curVal = (val!==undefined && val!==null && val!=='') ? Number(val) : null;
      const m = curVal !== null && curVal >= 9;
      btns.forEach(b=>{
        if(curVal===null) b.classList.toggle('on', b.dataset.val==='');
        else if(m) b.classList.toggle('on', b.dataset.val==='more');
        else b.classList.toggle('on', b.dataset.val===String(curVal));
      });
      moreInput.style.display=m?'inline-block':'none';
      moreInput.value=m?curVal:'';
      updateSync();
    }
  };
  updateSync();
  return picker;
}

function createTimePicker(initialVal, syncInput){
  const wrap=document.createElement('div');
  wrap.className='time-picker';
  wrap.style.cssText='display:flex;flex-direction:column;gap:4px';
  const topRow=document.createElement('div');
  topRow.style.cssText='display:flex;gap:4px';
  const grid=document.createElement('div');
  grid.className='btn-grid cols-5';

  const mkBtn=(text, val, on)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='t-btn'+(on?' on':'');
    b.textContent=text; b.dataset.val=val;
    return b;
  };

  const btns=[];
  let curVal = initialVal || '';
  const undBtn = mkBtn('未定', '', !curVal);
  undBtn.style.cssText='flex:none;width:5em';
  btns.push(undBtn);
  topRow.appendChild(undBtn);

  let customBtn = null;
  if(curVal && !TIMES.includes(curVal)){
    customBtn = mkBtn(curVal, curVal, true);
    btns.push(customBtn);
    grid.appendChild(customBtn);
  }

  TIMES.forEach(t=>{
    const b=mkBtn(t, t, curVal===t);
    btns.push(b);
    grid.appendChild(b);
  });

  const updateSync=()=>{
    if(!syncInput) return;
    syncInput.value = picker.getValue();
  };

  const bindBtn=(b)=>{
    b.onclick=()=>{
      btns.forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      updateSync();
    };
  };
  btns.forEach(bindBtn);

  wrap.append(topRow, grid);
  const picker = {
    el: wrap,
    getValue: ()=>{
      const active=btns.find(b=>b.classList.contains('on'));
      return active ? active.dataset.val : '';
    },
    setValue: (val)=>{
      const v = val || '';
      if(v && !TIMES.includes(v)){
        if(!customBtn){
          customBtn = mkBtn(v, v, true);
          btns.unshift(customBtn);
          bindBtn(customBtn);
          grid.prepend(customBtn);
        } else {
          customBtn.textContent = v;
          customBtn.dataset.val = v;
        }
      }
      btns.forEach(b=>b.classList.toggle('on', b.dataset.val===v));
      updateSync();
    }
  };
  updateSync();
  return picker;
}

function openForm(kind,e,forDate,seatNo){
  const d=forDate||date;
  const f=document.getElementById('frm');
  const isSeat=seatNo!==undefined&&seatNo!==null;
  const isWaitInitial=!isSeat && (kind==='wait' || e?.kind==='wait');
  const isToday=d===today();
  const nameRequired=isSeat?!isToday:true;

  let title='';
  if(isSeat){
    const dObj=parse(d);
    title=`予約：卓 ${seatNo}（${dObj.getMonth()+1}/${dObj.getDate()}）`;
  } else {
    title=`${e?'編集':'新規'}：予約（${d}）`;
  }

  const nameLabelText = isToday ? '名前（空欄なら来店客）' : '名前*';

  f.innerHTML=`<h3>${title}</h3>
   <label id="nameLbl">${nameLabelText}</label><input name="name" ${nameRequired?'required':''} autofocus autocomplete="off" autocorrect="off" spellcheck="false" ${isSeat&&isToday?'placeholder="空欄で「来店客」として使用中"':''}>
   <label>人数</label><div id="fPeoplePicker"></div><input type="hidden" name="people" autocomplete="off">
   <label>時間</label><div id="fTimePicker"></div><input type="hidden" name="time" autocomplete="off">
   ${isSeat?'':'<label>電話待ち</label><input type="checkbox" name="wait" autocomplete="off" style="width:auto;justify-self:start" '+(isWaitInitial?'checked':'')+'>'}
   <label>電話番号<span class="tel-req" ${isWaitInitial?'':'hidden'}>*</span></label><input name="tel" type="tel" inputmode="tel" autocomplete="off" ${isWaitInitial?'required':''}>
   <label>要望</label><textarea name="note" rows="2" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
   ${isSeat?'':'<label>卓</label><input name="tables" autocomplete="off" placeholder="空欄なら卓未定">'}
   ${isSeat?'':'<label>日付</label><input name="date" type="date" required>'}
   <p class="message" hidden></p>
   <div class="wide">
     <button value="ok" type="submit" class="on" id="frmSaveBtn">保存</button>
     <button value="cancel" type="submit" formnovalidate>閉じる</button>
   </div>`;

  const saveBtn = f.querySelector('#frmSaveBtn');
  const updateSaveBtnLabel = () => {
    if(isSeat){
      const nv = f.name.value.trim();
      saveBtn.textContent = (isToday && !nv) ? '来店客として使用中にする' : `卓${seatNo}に予約する`;
    } else {
      saveBtn.textContent = '卓未定で保存';
    }
  };

  const peoplePick = createPeoplePicker(e?.people, f.people);
  f.querySelector('#fPeoplePicker').appendChild(peoplePick.el);
  const timePick = createTimePicker(e?.time, f.time);
  f.querySelector('#fTimePicker').appendChild(timePick.el);

  if(!isSeat){
    f.date.value=e?.date??d;
    if(e?.tables) f.tables.value=e.tables.join(', ');
    const waitCb=f.querySelector('input[name="wait"]');
    const telInput=f.querySelector('input[name="tel"]');
    const telReq=f.querySelector('.tel-req');
    if(waitCb&&telInput){
      waitCb.onchange=()=>{
        telInput.required=waitCb.checked;
        if(telReq) telReq.hidden=!waitCb.checked;
      };
    }
  }
  if(e){
    for(const k of['name','tel','note']) f[k].value=e[k]??'';
  }

  f.name.oninput = updateSaveBtnLabel;
  updateSaveBtnLabel();

  f.onkeydown=ev=>{if(ev.key==='Enter'&&ev.isComposing) ev.preventDefault()};
  const dlg=document.getElementById('dlg');
  dlg.onclose=null;
  dlg.showModal();

  f.onsubmit=ev=>{
    const v=ev.submitter?.value??'ok';
    if(v==='ok'){
      if(!f.reportValidity()){ev.preventDefault();return}
      const targetD=isSeat?d:f.date.value;
      if(!isSeat && CLOSED_WEEKDAYS.includes(parse(targetD).getDay())){
        const msg=f.querySelector('.message');
        if(msg){msg.hidden=false;msg.textContent='水曜日は定休日です'}
        ev.preventDefault();
        return;
      }
      let nameVal=f.name.value.trim();
      const walkIn=isSeat && isToday && !nameVal;   // 名前で判定しない（「来店客」と打った予約まで使用中にしない）
      if(walkIn) nameVal='来店客';
      if(!nameVal){
        ev.preventDefault();
        return;
      }
      const chosenKind=isSeat ? 'res' : (f.querySelector('input[name="wait"]')?.checked ? 'wait' : 'res');

      // 卓の検証（F4, F15）
      let parsedTables = [];
      if(isSeat){
        parsedTables = [seatNo];
      } else {
        const tblInput = normalizeDigits(f.tables ? f.tables.value : '');
        if(tblInput){
          parsedTables = tblInput.split(/[、,・\s]+/).filter(Boolean);
          const allNosTarget = ROWS.flatMap(r=>r.nos).concat(extraOf(targetD));
          const missingNo = parsedTables.find(no => !allNosTarget.includes(no));
          if(missingNo){
            ev.preventDefault();
            const msg=f.querySelector('.message');
            if(msg){msg.hidden=false;msg.textContent=`卓${missingNo}はその日にありません`;}
            return;
          }
          if(!validTables(parsedTables, targetD)){
            ev.preventDefault();
            const msg=f.querySelector('.message');
            if(msg){msg.hidden=false;msg.textContent='卓は同じ種類の中から指定してください。';}
            return;
          }
        }
      }

      // 全検査が通ってから代入（F5）
      const o=e||{id:uid(),date:targetD,kind:chosenKind,tables:[],arrived:false,gone:false,called:false,cancelled:false};
      if(chosenKind==='wait' && (!e || e.kind!=='wait')){
        o.called=false;
      }
      o.kind=chosenKind;
      o.date=targetD;
      o.name=nameVal;
      o.tel=f.tel.value.trim();
      o.time=timePick.getValue();
      o.people=peoplePick.getValue();
      o.note=f.note.value.trim();

      if(isSeat){
        if(!e) db.entries.push(o);
        assignTables(o,[seatNo],targetD);
        if(walkIn){
          o.arrived=true;
          setOcc(seatNo,true);
        }
      } else {
        if(parsedTables.length>0){
          assignTables(o, parsedTables, targetD);
        } else {
          if(e) unassign(e);
          else o.tables = [];
        }
        if(!e) db.entries.push(o);
      }
    } else return; // cancel
    save();draw();
  };
}

function openEdit(e,no){
  const f=document.getElementById('editFrm'), dlg=document.getElementById('editDlg');
  f.innerHTML=`<h3></h3>
   <label>名前</label><input name="name" required autocomplete="off" autocorrect="off" spellcheck="false">
   <label>人数</label><div id="editPeoplePicker"></div><input type="hidden" name="people" autocomplete="off">
   <label>時間</label><div id="editTimePicker"></div><input type="hidden" name="time" autocomplete="off">
   <label>電話番号</label><input name="tel" type="tel" inputmode="tel" autocomplete="off">
   <label>要望</label><textarea name="note" rows="2" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
   <label>卓の変更・複数卓</label><input name="tables" autocomplete="off" placeholder="例: 1, 2, 3">
   <p class="message" hidden></p>
   <div class="wide">
     <button value="save" type="submit" class="on">保存</button>
     <button value="release" type="submit">割り当て解除</button>
     <button value="cancel" type="submit">取消</button>
     <button value="close" type="submit">閉じる</button>
   </div>`;
  f.querySelector('h3').textContent=`${e.name}（卓 ${no}）`;

  const peoplePick = createPeoplePicker(e?.people, f.people);
  f.querySelector('#editPeoplePicker').appendChild(peoplePick.el);
  const timePick = createTimePicker(e?.time, f.time);
  f.querySelector('#editTimePicker').appendChild(timePick.el);

  for(const k of['name','tel','note']) f[k].value=e[k]??'';
  f.tables.value=e.tables.join(', ');
  f.onkeydown=ev=>{if(ev.key==='Enter'&&ev.isComposing) ev.preventDefault()};
  const message=f.querySelector('.message');
  f.onsubmit=ev=>{
    const action=ev.submitter?.value??'save';
    if(action==='close') return;
    if(action==='save'){
      if(!f.reportValidity()){ev.preventDefault();return}
      const rawTbl=normalizeDigits(f.tables ? f.tables.value : '');
      const tables=rawTbl?rawTbl.split(/[、,・\s]+/).filter(Boolean):[];
      if(tables.length===0){
        unassign(e);
      } else {
        if(!assignTables(e,tables,e.date)){
          ev.preventDefault();message.hidden=false;message.textContent='卓は同じ種類の中から指定してください。';return;
        }
      }
      for(const k of['name','tel','note']) e[k]=f[k].value.trim();
      e.people=peoplePick.getValue();
      e.time=timePick.getValue();
    } else if(action==='release') unassign(e);
    else if(action==='cancel'){cancelEntry(e);return}
    save();draw();
  };
  dlg.showModal();
}

const KEYBOARD_MIN=120;
function fitDialogsToKeyboard(hidden,visibleH,offsetTop){
  const up=hidden>KEYBOARD_MIN;
  document.querySelectorAll('dialog[open]').forEach(d=>{
    const s=d.style;
    if(up){
      s.position='fixed';s.left='0';s.right='0';s.bottom='auto';
      s.top=(offsetTop+6)+'px';
      s.marginTop='0';s.marginBottom='0';s.marginLeft='auto';s.marginRight='auto';
      s.maxHeight=(visibleH-12)+'px';
    }else{
      s.position='';s.left='';s.right='';s.top='';s.bottom='';
      s.marginTop='';s.marginBottom='';s.marginLeft='';s.marginRight='';s.maxHeight='';
    }
  });
  return up;
}
function syncDialogsToViewport(){
  const vv=window.visualViewport;
  if(!vv) return false;
  return fitDialogsToKeyboard(window.innerHeight-vv.height,vv.height,vv.offsetTop);
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',syncDialogsToViewport);
  window.visualViewport.addEventListener('scroll',syncDialogsToViewport);
}
document.addEventListener('focusin',ev=>{
  if(!ev.target.closest?.('dialog')) return;
  setTimeout(()=>{syncDialogsToViewport();ev.target.scrollIntoView({block:'center',behavior:'smooth'})},120);
});
$('bkpFile').onchange=()=>{
  const file=$('bkpFile').files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    $('bkpFile').value='';
    const text=String(reader.result);
    confirmThen('今のデータをファイルの内容で置き換えます。よろしいですか？',async ()=>{
      try{
        await saveSnapshot('manual');
        if(importText(text)){save();draw();bkpDlg.close()}
        else alert('このファイルはバックアップとして読み込めませんでした。');
      }catch(_e){
        alert('現在の状態を控えに保存できなかったため、置き換えを中止しました。');
      }
    },'置き換える');
  };
  reader.readAsText(file);
};

  delF2Btn.click();
  check(!extraOf(today()).includes(f2Seat), 'F2: 臨時席は×ボタンでのみ消える');

  /* --- F3: 戻す時、存在しない卓番を取り除き、全部無くなれば卓未定(arrived=false)＋ヒント表示 --- */
  const f3Seat = '36';
  addExtra(today(), f3Seat); draw();
  document.querySelector(`.seat[data-no="${f3Seat}"]`).click();
  $('frm').name.value = 'F3客';
  $('frm').querySelector('button[value="ok"]').click();
  const f3Entry = db.entries.find(e => e.name === 'F3客');
  document.querySelector(`.seat[data-no="${f3Seat}"] .chip`).click();
  [...$('#actBtns').querySelectorAll('button')].find(b => b.textContent === '使用中にする').click();
  document.querySelector(`.seat[data-no="${f3Seat}"] .chip`).click();
  [...$('#actBtns').querySelectorAll('button')].find(b => b.textContent === '食事終了').click();
  check(f3Entry.gone, 'F3: 食事終了');
  delExtra(f3Seat);
  check(!extraOf(today()).includes(f3Seat), 'F3: 臨時席36を削除');
  if ($('cxList').hidden) $('cxToggle').click();
  const f3Item = [...$('cxList').querySelectorAll('.item')].find(it => it.querySelector('.nm')?.textContent === 'F3客');
  f3Item.querySelector('button').click(); // 使用中に戻す
  check(f3Entry && f3Entry.tables.length === 0 && !f3Entry.arrived && !f3Entry.gone, 'F3: 存在しない卓36が取り除かれ卓未定(arrived=false)として戻る');
  check($('hint').textContent.includes('卓36が無いので卓未定に戻しました'), 'F3: ヒント欄に卓36が無いので卓未定に戻しましたと表示される');

  /* --- F4: 卓妥当性判定を変更先の日付で判定、その日に無い臨時席は拒否 --- */
  const f4Seat = '37';
  addExtra(today(), f4Seat); draw();
  const f4DateOther = getOpenDate(addDays(today(), 1));
  const f4Entry = entry('f4-entry', 'F4客');
  db.entries.push(f4Entry); draw();
  openForm('res', f4Entry);
  $('frm').date.value = f4DateOther;
  $('frm').querySelector('input[name="tables"]').value = f4Seat;
  $('frm').querySelector('button[value="ok"]').click();
  check(!db.entries.some(e => e.name === 'F4客' && e.date === f4DateOther), 'F4: 変更先の日付に無い臨時席37は保存拒否される');
  check($('frm').querySelector('.message').textContent.includes('卓37はその日にありません'), 'F4: 「卓37はその日にありません」と表示される');
  $('dlg').close();
  delExtra(f4Seat);

  /* --- F5: 保存拒否された編集内容が既存予約に先に書き込まれない --- */
  const f5Entry = entry('f5-entry', 'F5元名');
  db.entries.push(f5Entry); draw();
  openForm('res', f5Entry);
  $('frm').name.value = 'F5変更名';
  $('frm').querySelector('input[name="tables"]').value = '1, 8';
  $('frm').querySelector('button[value="ok"]').click();
  check(f5Entry.name === 'F5元名', 'F5: 卓エラー時に既存予約のnameは書き換わっていない');
  $('dlg').close();
  check(f5Entry.name === 'F5元名', 'F5: フォームを閉じた後もF5元名のまま');

  /* --- F6: 日付変更で開いているdialogがすべて閉じる --- */
  document.querySelector('.seat[data-no="1"]').click();
  check($('dlg').open, 'F6準備: ダイアログが開いている');
  const origTodayF6 = today;
  const origLastTodayF6 = lastToday;
  lastToday = origTodayF6();
  const f6Tomorrow = addDays(origTodayF6(), 1);
  today = () => f6Tomorrow;
  checkDayChange();
  check(!$('dlg').open, 'F6: checkDayChangeで開いていたdialogがすべて閉じられる');
  today = origTodayF6; lastToday = origLastTodayF6; date = today(); draw();

  /* --- F7: undo()のsetItem失敗でdb・lastSaved・undoStackが壊れない --- */
  const f7CountBefore = db.entries.length;
  const f7Entry = entry('f7-entry', 'F7客');
  db.entries.push(f7Entry); save();
  check(db.entries.length === f7CountBefore + 1, 'F7: 1件保存');
  const origSetItemF7 = localStorage.setItem;
  localStorage.setItem = () => { throw new Error('QuotaExceededError'); };
  undo();
  check(db.entries.some(e => e.name === 'F7客'), 'F7: setItem失敗時はdbは巻き戻らず元の状態を維持');
  localStorage.setItem = origSetItemF7;
  undo();
  check(!db.entries.some(e => e.name === 'F7客'), 'F7: 正常なundoで予約が戻る');

  /* --- F8: 複数卓のチップを同じ予約の別卓へ動かしても重複しない --- */
  const f8Entry = entry('f8-entry', 'F8客', ['1', '2']);
  db.entries.push(f8Entry); draw();
  const f8Chip1 = document.querySelector('.seat[data-no="1"] .chip[data-entry-id="f8-entry"]');
  const f8Seat2 = document.querySelector('.seat[data-no="2"]');
  dragFromTo(f8Chip1, f8Seat2);
  check(f8Entry.tables.length === 2 && f8Entry.tables.includes('1') && f8Entry.tables.includes('2') && !f8Entry.tables.every(t => t === '2'), 'F8: 複数卓のチップを同予約の別卓へ動かしても移動せず重複しない');

  /* --- F9: 使用中の予約で卓欄を空にして保存するとunassignされarrived=false --- */
  const f9Entry = entry('f9-entry', 'F9客', ['3']);
  db.entries.push(f9Entry); arrive(f9Entry);
  check(f9Entry.arrived && occOf(today()).includes('3'), 'F9準備: 卓3で使用中');
  openEdit(f9Entry, 3);
  $('editFrm').querySelector('input[name="tables"]').value = '';
  $('editFrm').querySelector('button[value="save"]').click();
  check(f9Entry.tables.length === 0 && !f9Entry.arrived && !occOf(today()).includes('3'), 'F9: openEditで卓欄を空にして保存するとunassignされarrived=falseかつocc解除');
  assignTables(f9Entry, ['3']); arrive(f9Entry);
  check(f9Entry.arrived && occOf(today()).includes('3'), 'F9準備2: 卓3で使用中');
  openForm('res', f9Entry);
  $('frm').querySelector('input[name="tables"]').value = '';
  $('frm').querySelector('button[value="ok"]').click();
  check(f9Entry.tables.length === 0 && !f9Entry.arrived && !occOf(today()).includes('3'), 'F9: openFormで卓欄を空にして保存するとunassignされarrived=falseかつocc解除');

  /* --- F10: 長い名前で卓未定カードが横にはみ出さず、チップで人数・時間が隠れない --- */
  const f10Name = '山田太郎家ご一同様';
  const f10Entry = entry('f10-entry', f10Name);
  f10Entry.people = 8; f10Entry.time = '19:00'; f10Entry.tel = '090-1234-5678';
  db.entries.push(f10Entry); draw();
  const f10Card = document.querySelector('#resList .item[data-entry-id="f10-entry"]');
  const l1El = f10Card.querySelector('.l1');
  check(getComputedStyle(l1El).flexWrap === 'wrap', 'F10: .item .l1 が flex-wrap:wrap になっている');
  check(f10Card.scrollWidth <= f10Card.clientWidth + 5, `F10: 卓未定カードでメタが折り返され横スクロールが出ない (${f10Card.scrollWidth} <= ${f10Card.clientWidth})`);
  assignTables(f10Entry, ['8']); draw();
  const f10Chip = document.querySelector('.seat[data-no="8"] .chip[data-entry-id="f10-entry"]');
  const f10People = f10Chip.querySelector('.chip-people');
  const f10Time = f10Chip.querySelector('.chip-time');
  check(f10People && f10Time && f10People.offsetHeight > 0 && f10Time.offsetHeight > 0, 'F10: チップ内で人数と時間の行が隠れず残っている');
  unassign(f10Entry);

  /* --- F11: 来店済みの電話待ちに電話待ち札と連絡済にするが出ない --- */
  const f11Entry = entry('f11-entry', 'F11待ち', ['11']);
  f11Entry.kind = 'wait'; f11Entry.tel = '090-0000-1111';
  db.entries.push(f11Entry); arrive(f11Entry); draw();
  const f11Chip = document.querySelector('.seat[data-no="11"] .chip[data-entry-id="f11-entry"]');
  check(!f11Chip.querySelector('.badge') || f11Chip.querySelector('.badge').textContent !== '電話待ち', 'F11: 来店済みの電話待ちチップに電話待ち札が出ない');
  f11Chip.click();
  check($('actDlg').open, 'F11: 状態画面が開く');
  const f11Btns = [...$('#actBtns').querySelectorAll('button')].map(b => b.textContent);
  check(!f11Btns.includes('連絡済にする') && !f11Btns.includes('連絡済を外す'), 'F11: 来店済みの状態画面に「連絡済にする」ボタンが出ない');
  $('actDlg').close();

  /* --- F12: 30分刻み以外の時刻の予約を編集保存しても時刻が消えない --- */
  const f12Entry = entry('f12-entry', 'F12客', ['12']);
  f12Entry.time = '18:15';
  db.entries.push(f12Entry); draw();
  openEdit(f12Entry, 12);
  const f12Btn1815 = [...$('editFrm').querySelectorAll('.t-btn')].find(b => b.textContent === '18:15');
  check(f12Btn1815 && f12Btn1815.classList.contains('on'), 'F12: 18:15ボタンが格子の先頭に追加され選択状態になっている');
  $('editFrm').querySelector('button[value="save"]').click();
  check(f12Entry.time === '18:15', 'F12: 18:15の予約を編集保存しても時刻が維持される');

  /* --- F13: 文字 大／小 が undoStack を消費しない --- */
  const f13Entry = entry('f13-entry', 'F13客');
  db.entries.push(f13Entry); save();
  const f13StackCount = undoStack.length;
  for (let i = 0; i < 6; i++) {
    $('fsUp').click();
  }
  check(undoStack.length === f13StackCount, 'F13: 文字大を6回押してもundoStackの件数は増えない');
  $('undoBtn').click();
  check(!db.entries.some(e => e.name === 'F13客'), 'F13: 文字大の後でも元に戻すで直前の予約操作が元に戻る');

  /* --- F14: 「終了・取消」を開いたまま最後の1件を戻すと閉じられてボタンが「表示」disabled --- */
  db.entries.forEach(e => { e.cancelled = false; e.gone = false; });
  const f14Entry = entry('f14-entry', 'F14客');
  f14Entry.cancelled = true;
  db.entries.push(f14Entry); draw();
  const cxToggleBtn = $('cxToggle');
  if ($('cxList').hidden) cxToggleBtn.click();
  check(!$('cxList').hidden, 'F14: 一覧が開いている');
  const f14Item = [...$('cxList').querySelectorAll('.item')].find(it => it.querySelector('.nm')?.textContent === 'F14客');
  f14Item.querySelector('button').click(); // 予約に戻す
  check($('cxList').hidden, 'F14: 最後の1件を戻すと一覧が閉じる');
  check(cxToggleBtn.textContent === '表示' && cxToggleBtn.disabled, 'F14: ボタン文言が「表示」に戻りdisabledになる');

  /* --- F15: 全角数字が卓欄で半角化され、臨時席で重複作成されない --- */
  $('addRes').click();
  $('frm').name.value = 'F15全角卓';
  $('frm').querySelector('input[name="tables"]').value = '１２'; // 全角数字
  $('frm').querySelector('button[value="ok"]').click();
  const f15Res = db.entries.find(e => e.name === 'F15全角卓');
  check(f15Res && f15Res.tables.join() === '12', 'F15: 全角数字１２が半角12として正常に割り当て保存される');
  $('exNo').value = '１'; // 全角数字（既に卓1が存在する）
  $('exAdd').click();
  check(!extraOf(today()).includes('1') && !extraOf(today()).includes('１'), 'F15: 全角数字１の臨時席追加は半角1と重複判定されて拒否される');
  $('exNo').value = '';

  /* --- F16: ファイル読み戻しの確定時に saveSnapshot('manual') の完了を待ってから置き換える --- */
  const f16Entry = entry('f16-entry', 'F16保存直前データ');
  db.entries.push(f16Entry); draw();
  const f16ImportJson = JSON.stringify({ v: 1, data: { entries: [entry('f16-after', 'F16新データ')], extra: [], occ: {}, fs: 19 } });
  await saveSnapshot('manual');
  const snapAfter = await listSnapshots();
  const latestSnap = snapAfter.sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];
  check(latestSnap && latestSnap.text.includes('F16保存直前データ'), 'F16: 置き換え前に現在の状態の控えが自動保存される');
  importText(f16ImportJson); save(); draw();
  check(db.entries.some(e => e.name === 'F16新データ'), 'F16: 控え保存後に新データに置き換わる');

  /* --- F17: 文字最大(fs=24)でもダイアログが収まり保存ボタンが常に見える --- */
  db.fs = 24; draw();
  openForm('res', null);
  const dlgEl = $('dlg');
  const stickyWide = $('frm').querySelector('.wide:last-of-type');
  check(dlgEl.offsetHeight <= 768, 'F17: fs=24でもダイアログの高さが画面内に収まる');
  check(getComputedStyle(stickyWide).position === 'sticky', 'F17: 保存・閉じるの行がposition:stickyで常に見える');
  dlgEl.close();
  db.fs = 17; draw();

  /* --- F18: 卓欄に inputmode="numeric" が無い --- */
  openForm('res', null);
  const formTblInput = $('frm').querySelector('input[name="tables"]');
  check(!formTblInput.hasAttribute('inputmode'), 'F18: openFormの卓欄にinputmode属性が無い');
  $('dlg').close();
  openEdit(f15Res, 12);
  const editTblInput = $('editFrm').querySelector('input[name="tables"]');
  check(!editTblInput.hasAttribute('inputmode'), 'F18: openEditの卓欄にinputmode属性が無い');
  $('editDlg').close();

  db=JSON.parse(bk);date=oldDate;weekStart=oldWeekStart;save();draw();
  window.alert=_origAlert;
  const resMsg=`self-check passed: ${checks}件`;
  document.title=resMsg;
  document.body.setAttribute('data-test-result',resMsg);
  console.log(resMsg);
  console.warn(resMsg);
  }catch(err){
    window.alert=_origAlert;
    const errMsg=`self-check failed: ${err.message}`;
    document.title=errMsg;
    document.body.setAttribute('data-test-result',errMsg);
    console.error(errMsg);
    throw err;
  }
})();
</script>
</body>
</html>
